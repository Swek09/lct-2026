<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Cat tint test</title>
  <style>
    body { margin: 0; background: #faf8f3; font-family: sans-serif; }
    #app { width: 100%; height: 100vh; }
    #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: rgba(255,255,255,.85); padding: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; }
    button { padding: 4px 8px; border: 1px solid #ccc; background: #fff; border-radius: 6px; cursor: pointer; }
    #info { position: fixed; bottom: 6px; left: 6px; background: rgba(0,0,0,.7); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 11px; }
  </style>
</head>
<body>
  <div id="bar"></div>
  <div id="app"></div>
  <div id="info"></div>
  <script type="module">
    import * as THREE from './node_modules/three/build/three.module.js';
    import { GLTFLoader } from './node_modules/three/examples/jsm/loaders/GLTFLoader.js';

    const app = document.getElementById('app');
    const bar = document.getElementById('bar');
    const info = document.getElementById('info');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(2);
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xfaf8f3);
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 50);
    camera.position.set(0, 1.1, 5.5);
    camera.lookAt(0, 0.8, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 1.8));
    const key = new THREE.DirectionalLight(0xfffaed, 2.2); key.position.set(3,5,4); scene.add(key);
    const fill = new THREE.DirectionalLight(0xbad7ff, 1.0); fill.position.set(-3,2,-2); scene.add(fill);
    const front = new THREE.DirectionalLight(0xfff8ee, 1.4); front.position.set(0,1.5,4); scene.add(front);

    // ground plane
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(2.2, 48),
      new THREE.MeshStandardMaterial({ color: 0xede6d8, roughness: 0.95 })
    );
    ground.rotation.x = -Math.PI/2; ground.position.y = 0; scene.add(ground);

    const params = new URLSearchParams(location.search);
    const model = params.get('model') || 'cat.glb';
    const colorHex = params.get('color') || '';
    const method = params.get('method') || 'none'; // none | color | tint | repaint

    const loader = new GLTFLoader();
    loader.load('/models/' + model, (gltf) => {
      const root = gltf.scene;
      const box = new THREE.Box3().setFromObject(root);
      const center = new THREE.Vector3(); box.getCenter(center);
      root.position.x = -center.x; root.position.z = -center.z;
      scene.add(root);

      const mats = new Map();
      root.traverse((o) => {
        if (o.isMesh && o.material) {
          const m = Array.isArray(o.material) ? o.material[0] : o.material;
          if (!mats.has(m.uuid)) mats.set(m.uuid, { name: m.name, mesh: o.name });
        }
      });

      const infoLines = [];
      infoLines.push('model=' + model + ' method=' + method + ' color=' + (colorHex || 'none'));
      root.traverse((o) => {
        if (o.isMesh) {
          const m = Array.isArray(o.material) ? o.material[0] : o.material;
          infoLines.push('mesh=' + o.name + ' mat=' + m.name + ' col=' + (m.color ? m.color.getHexString() : '?'));
        }
      });
      info.textContent = infoLines.join(' | ');

      if (method === 'color' && colorHex) {
        root.traverse((o) => {
          if (o.isMesh) {
            const m = Array.isArray(o.material) ? o.material[0] : o.material;
            if (m.color) m.color.set(colorHex);
          }
        });
      }

      if (method === 'tint' && colorHex) {
        root.traverse((o) => {
          if (o.isMesh) {
            const m = Array.isArray(o.material) ? o.material[0] : o.material;
            if (m.color) m.color.set(colorHex);
          }
        });
        // also set emissive tint low
      }

      window.__loaded = true;
      window.__info = infoLines;
    });

    const clock = new THREE.Clock();
    function animate(){
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
    window.__ready = true;
  </script>
</body>
</html>
