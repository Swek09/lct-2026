<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Cat tint test</title>
  <style>
    body { margin: 0; background: #faf8f3; font-family: sans-serif; }
    #app { width: 100%; height: 100vh; }
    #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: rgba(255,255,255,.85); padding: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; }
    button { padding: 4px 8px; border: 1px solid #ccc; background: #fff; border-radius: 6px; cursor: pointer; }
    #info { position: fixed; bottom: 6px; left: 6px; background: rgba(0,0,0,.7); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 11px; }
  </style>
</head>
<body>
  <div id="bar"></div>
  <div id="app"></div>
  <div id="info"></div>
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/examples/jsm/loaders/GLTFLoader.js": "/node_modules/three/examples/jsm/loaders/GLTFLoader.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

    const app = document.getElementById('app');
    const bar = document.getElementById('bar');
    const info = document.getElementById('info');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(2);
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xfaf8f3);
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 50);
    camera.position.set(0, 1.0, 4.2);
    camera.lookAt(0, 0.55, 0);

    // Balanced soft studio lighting with contrast
    const ambient = new THREE.AmbientLight(0xfff8f0, 0.7);
    scene.add(ambient);

    const key = new THREE.DirectionalLight(0xfffaed, 1.7);
    key.position.set(3, 4.5, 3.5);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xbadaff, 0.65);
    fill.position.set(-3, 2, 1);
    scene.add(fill);

    const front = new THREE.DirectionalLight(0xfff8ee, 0.6);
    front.position.set(0, 1.2, 3);
    scene.add(front);

    // ground plane
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(2.2, 48),
      new THREE.MeshStandardMaterial({ color: 0xede6d8, roughness: 0.95 })
    );
    ground.rotation.x = -Math.PI/2; ground.position.y = 0; scene.add(ground);

    const params = new URLSearchParams(location.search);
    const model = params.get('model') || 'cat.glb';
    const colorHex = params.get('color') || '';
    const method = params.get('method') || 'none'; // none | color | tint | repaint

    const loader = new GLTFLoader();
    loader.load('/models/' + model, (gltf) => {
      const root = gltf.scene;
      const box = new THREE.Box3().setFromObject(root);
      const center = new THREE.Vector3(); box.getCenter(center);
      root.position.x = -center.x; root.position.z = -center.z;
      scene.add(root);

      const mats = new Map();
      root.traverse((o) => {
        if (o.isMesh && o.material) {
          const m = Array.isArray(o.material) ? o.material[0] : o.material;
          if (!mats.has(m.uuid)) mats.set(m.uuid, { name: m.name, mesh: o.name });
        }
      });

      const infoLines = [];
      infoLines.push('model=' + model + ' method=' + method + ' color=' + (colorHex || 'none'));
      root.traverse((o) => {
        if (o.isMesh) {
          const m = Array.isArray(o.material) ? o.material[0] : o.material;
          infoLines.push('mesh=' + o.name + ' mat=' + m.name + ' col=' + (m.color ? m.color.getHexString() : '?'));
        }
      });
      info.textContent = infoLines.join(' | ');

      if (method === 'color' && colorHex) {
        root.traverse((o) => {
          if (o.isMesh) {
            const m = Array.isArray(o.material) ? o.material[0] : o.material;
            if (m.color) m.color.set(colorHex);
          }
        });
      }

      if (method === 'toon') {
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;

        const rim = new THREE.DirectionalLight(0xffffff, 2.0);
        rim.position.set(0, 3.5, -3.2);
        scene.add(rim);

        const coatPalette = {
          ginger: { color: "#ff9e59", emissive: "#261105", rimColor: 0xfff0db, roughness: 0.98 },
          white: { color: "#ffffff", emissive: "#141720", rimColor: 0xffffff, roughness: 0.98 },
          black: { color: "#22252e", emissive: "#05070a", rimColor: 0xbac5da, roughness: 0.98 },
          gray: { color: "#dfe4ec", emissive: "#101318", rimColor: 0xffeedd, roughness: 0.98 },
        };

        const coatChoice = colorHex || 'ginger';
        const pal = coatPalette[coatChoice] || coatPalette.gray;
        const furNames = new Set(["Cube", "body001", "BézierCurve", "leg-front-right001", "Scene.007", "Scene.010"]);

        root.traverse((o) => {
          if (o.isMesh && o.material) {
            const m = Array.isArray(o.material) ? o.material[0] : o.material;
            if (furNames.has(o.name)) {
              m.color.set(pal.color);
              m.emissive.set(pal.emissive);
              m.roughness = pal.roughness;
              m.metalness = 0.0;
            } else if (o.name === 'Circle.001' || o.name === 'Circle' || o.name === 'Circle.003') {
              m.roughness = 0.12;
              m.metalness = 0.15;
            }

            m.onBeforeCompile = (shader) => {
              const rCol = furNames.has(o.name) ? pal.rimColor : 0xffffff;
              shader.uniforms.uRimColor = { value: new THREE.Color(rCol) };
              shader.uniforms.uRimPower = { value: furNames.has(o.name) ? 2.7 : 3.5 };
              shader.uniforms.uRimIntensity = { value: furNames.has(o.name) ? 0.85 : 0.5 };
              shader.uniforms.uToonEnable = { value: 1.0 };
              shader.uniforms.uToonIntensity = { value: 1.0 };

              shader.fragmentShader = `
                uniform vec3 uRimColor;
                uniform float uRimPower;
                uniform float uRimIntensity;
                uniform float uToonEnable;
                uniform float uToonIntensity;
              ` + shader.fragmentShader;

              shader.fragmentShader = shader.fragmentShader.replace(
                '#include <lights_fragment_end>',
                `#include <lights_fragment_end>
                if (uToonEnable > 0.5) {
                  float directLuma = dot(reflectedLight.directDiffuse, vec3(0.299, 0.587, 0.114));
                  if (directLuma > 0.0001) {
                    float stepFactor = 0.36;
                    stepFactor += 0.34 * smoothstep(0.08, 0.18, directLuma);
                    stepFactor += 0.35 * smoothstep(0.38, 0.50, directLuma);
                    reflectedLight.directDiffuse = (reflectedLight.directDiffuse / directLuma) * stepFactor * uToonIntensity;
                  }
                }`
              );

              shader.fragmentShader = shader.fragmentShader.replace(
                'vec3 outgoingLight = totalDiffuse + totalSpecular + totalEmissiveRadiance;',
                `if (uToonEnable > 0.5) {
                  totalSpecular *= 0.15;
                }
                vec3 outgoingLight = totalDiffuse + totalSpecular + totalEmissiveRadiance;
                float fresnel = 1.0 - saturate(dot(geometryNormal, geometryViewDir));
                fresnel = pow(fresnel, uRimPower) * uRimIntensity;
                outgoingLight += uRimColor * fresnel;`
              );
            };
            m.customProgramCacheKey = () => `toon_${o.name}_${coatChoice}`;
            m.needsUpdate = true;
          }
        });
      }

      window.__loaded = true;
      window.__info = infoLines;
    });

    const clock = new THREE.Clock();
    function animate(){
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
    window.__ready = true;
  </script>
</body>
</html>
